<title>Green Shuffle</title>
<style>
  :root { --bg:#0e0f0d; --fg:rgba(255,255,255,.62); --fg-hover:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); overflow:hidden; }
  body { cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .stage { position:fixed; inset:0 0 28px 0; display:flex; align-items:center; justify-content:center; }
  .stage img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block;
               opacity:0; transition:opacity .45s ease; }
  .stage img.on { opacity:1; }
  .loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; gap:14px;
            transition:opacity .6s ease; pointer-events:none; }
  .loader.done { opacity:0; }
  .loader i { width:9px; height:9px; border-radius:50%; background:#7fb77e;
              animation:breathe 1.4s ease-in-out infinite; }
  .loader i:nth-child(2) { animation-delay:.18s; background:#5f9e6e; }
  .loader i:nth-child(3) { animation-delay:.36s; background:#3f8560; }
  @keyframes breathe {
    0%, 100% { transform:translateY(0) scale(.7); opacity:.35; }
    40%      { transform:translateY(-7px) scale(1); opacity:1; }
  }
  .credit { position:fixed; left:0; right:0; bottom:0; height:28px; display:flex; align-items:center; justify-content:center;
            padding:0 16px; font:11px/1.2 "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing:.01em; }
  .credit a { color:var(--fg); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; cursor:alias; }
  .credit a:hover { color:var(--fg-hover); }
  .credit .src { opacity:.6; }
</style>
</head>

const pic = document.getElementById('pic');
const credit = document.getElementById('credit');
const loader = document.getElementById('loader');
let bag = [], history = [], pos = -1;

// draw without repeats until every image has been shown once
function draw() {
  if (!bag.length) {
    bag = ITEMS.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    if (history.length && bag[bag.length - 1] === history[history.length - 1]) bag.unshift(bag.pop());
  }
  return bag.pop();
}

function show(idx) {
  const it = ITEMS[idx];
  const next = new Image();
  next.onload = () => {
    pic.classList.remove('on');
    setTimeout(() => {
      pic.src = it.img;
      pic.alt = it.cap;
      credit.href = it.src;
      credit.innerHTML = '';
      credit.append(it.cap + '  ');
      const s = document.createElement('span'); s.className = 'src'; s.textContent = '· ' + it.srcName; credit.append(s);
      requestAnimationFrame(() => pic.classList.add('on'));
      loader.classList.add('done');
    }, pic.src ? 200 : 0);
  };
  next.onerror = () => { forward(); };   // skip dead links
  next.src = it.img;
}

function forward() {
  if (pos < history.length - 1) { pos++; }
  else { history.push(draw()); pos = history.length - 1; }
  show(history[pos]);
  // warm the cache for the likely next one
  if (bag.length) { const p = new Image(); p.src = ITEMS[bag[bag.length - 1]].img; }
}
function back() { if (pos > 0) { pos--; show(history[pos]); } }

document.body.addEventListener('click', e => { if (!e.target.closest('.credit a')) forward(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); forward(); }
  if (e.key === 'ArrowLeft') back();
});
forward();
