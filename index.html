const pic = document.getElementById('pic');
const credit = document.getElementById('credit');
let bag = [], history = [], pos = -1;

// draw without repeats until every image has been shown once
function draw() {
  if (!bag.length) {
    bag = ITEMS.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    if (history.length && bag[bag.length - 1] === history[history.length - 1]) bag.unshift(bag.pop());
  }
  return bag.pop();
}

function show(idx) {
  const it = ITEMS[idx];
  const next = new Image();
  next.onload = () => {
    pic.classList.remove('on');
    setTimeout(() => {
      pic.src = it.img;
      pic.alt = it.cap;
      credit.href = it.src;
      credit.innerHTML = '';
      credit.append(it.cap + '  ');
      const s = document.createElement('span'); s.className = 'src'; s.textContent = '· ' + it.srcName; credit.append(s);
      requestAnimationFrame(() => pic.classList.add('on'));
    }, pic.src ? 200 : 0);
  };
  next.onerror = () => { forward(); };   // skip dead links
  next.src = it.img;
}

function forward() {
  if (pos < history.length - 1) { pos++; }
  else { history.push(draw()); pos = history.length - 1; }
  show(history[pos]);
  // warm the cache for the likely next one
  if (bag.length) { const p = new Image(); p.src = ITEMS[bag[bag.length - 1]].img; }
}
function back() { if (pos > 0) { pos--; show(history[pos]); } }

document.body.addEventListener('click', e => { if (!e.target.closest('.credit a')) forward(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); forward(); }
  if (e.key === 'ArrowLeft') back();
});
forward();
